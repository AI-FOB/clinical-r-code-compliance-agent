[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-r-code-compliance-agent"
version = "0.1.0"
description = "Clinical R Code Compliance Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "openai>=1.0.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=1.0",
    "tqdm>=4.66",
    "openpyxl>=3.0.0",
    "Jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.0",
]
